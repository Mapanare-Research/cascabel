name: Cascabel CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.platform }} / both compilers
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-14
            platform: mac-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y clang make
      - name: Install LLVM 18 on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned Mapanare release
        run: make setup
      - name: Test both compiler paths
        run: make test PYTHON=python
      - name: Build native engine
        run: make build
      - name: Package executable
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p dist
          VERSION=$(tr -d '[:space:]' < VERSION)
          cp LICENSE README.md build/
          tar -czf "dist/cascabel-$VERSION-$PLATFORM.tar.gz" -C build cascabel LICENSE README.md
      - uses: actions/upload-artifact@v4
        with:
          name: cascabel-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
