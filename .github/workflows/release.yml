name: Release Cascabel

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cascabel-*
          path: dist
          merge-multiple: true
      - name: Publish tested prototype binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(tr -d '[:space:]' < VERSION)"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS.txt \
            --title "Cascabel $RELEASE_TAG" --prerelease --notes-file CHANGELOG.md
